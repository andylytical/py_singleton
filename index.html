<!DOCTYPE html>
<html lang="en">
  <head>

  <body>
    <div class="reveal">
      <div class="slides">
        <section data-markdown>
          <textarea data-template>
            ### Goal
            Cache (memoize) common "items", such as:
            * Config <!-- .element: class="fragment" -->
              * read the config file once
            * Server connection <!-- .element: class="fragment" -->
              * make the connection once
            * Authenticated http connection <!-- .element: class="fragment" -->
              * authenticate once

            ---

            ### First approach
            Module level resources
            ```python
            resources = {} # module level resources

            def get_config():
              key = 'cfg'
              if key not in resources:
                config = # do work to get the config
                resources[key] = config
              return resources[key]
            ```
            * ❌Not available to other modules, classes, etc.

            --

            ### Try-except not any cleaner
            ```python
            resources = {} # module level resources

            def get_config():
              key = 'cfg'
              try:
                config = resources[key]
              except KeyError:
                config = # do work to get the config
                resources[key] = config
              return config
            ```

            ---

            ### Second approach
            functools.cached_property
            ```python
            from functools import cached_property

            class Config:
              def __init__():
                pass

              @cached_property
              def get_config():
                config = # do work to get config
                return config
            ```
            * ✅Decorator does the work to cache the result and check the cache
            * ❌Requires making a class
            * ❌Have to pass around references to the instance

            ---

            ### Third approach
            functools.cache
            ```python
            from functools import cache
            
            @cache
            def get_config():
              # do work to get config
              return config
            ```
            * ✅Decorator does the caching work
            * ✅Don't need a class
            * ✅Module is a singleton ...
              * Any code that imports the module gets the same shared state

            ---

            ### Example
            config.py
            ```
            from functools import cache

            @cache
            def get_config():
              config = # do work to get config
              return config
            ```
            anywhere_else.py
            ```
            import config

            if __name__ == '__main__':
              cfg = config.get_config()
            ```
